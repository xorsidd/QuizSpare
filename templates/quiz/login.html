{% extends 'base.html' %}

{% block title %}Log In - QuizSphere{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow rounded-4 overflow-hidden bg-white">
                <div class="bg-primary text-white p-4 text-center">
                    <div class="brand-icon-wrapper bg-white text-primary mx-auto mb-2" style="width: 48px; height: 48px;">
                        <i class="bi bi-bullseye fs-3"></i>
                    </div>
                    <h4 class="fw-bold mb-1 text-white">Student Sign In</h4>
                    <p class="small text-white-50 mb-0">Access your quizzes and score dashboard</p>
                </div>

                <div class="card-body p-4 p-md-5">
                    <form method="post" action="{% url 'login' %}">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label for="id_username" class="form-label fw-semibold small">Username</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-person text-muted"></i></span>
                                <input type="text" name="username" autofocus required class="form-control" id="id_username" placeholder="Enter your username">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="id_password" class="form-label fw-semibold small">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-lock text-muted"></i></span>
                                <input type="password" name="password" required class="form-control" id="id_password" placeholder="Enter your password">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-semibold shadow-sm mb-3">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                        </button>
                    </form>

                    <!-- Quick Demo Student Access Button -->
                    <div class="p-3 bg-light rounded-3 small text-muted mb-3 border text-center">
                        <div class="fw-bold text-dark mb-2"><i class="bi bi-key-fill text-warning me-1"></i> Quick Demo Student Login:</div>
                        <button type="button" class="btn btn-outline-primary btn-sm rounded-pill px-4" onclick="fillCreds('student', 'student123')">
                            Fill Demo Student Credentials
                        </button>
                    </div>

                    <div class="text-center small text-muted">
                        Don't have an account yet? 
                        <a href="{% url 'register' %}" class="fw-semibold text-primary text-decoration-none">Create Account</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function fillCreds(u, p) {
    document.getElementById('id_username').value = u;
    document.getElementById('id_password').value = p;
}
</script>
{% endblock %}
